name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package binaries
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/odtkra_agent.exe dist/
          Copy-Item build/Release/odtkra_control_panel.exe dist/

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: odtkra-binaries
          path: dist/*

  installer:
    runs-on: windows-latest
    needs: build-test
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\inno\odtkra.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: odtkra-installer
          path: packaging\output\*.exe
