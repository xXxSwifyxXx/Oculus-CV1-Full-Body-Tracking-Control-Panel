# Tag-triggered release workflow.
#
# This pipeline creates release artifacts from a tagged revision to keep deliverables traceable.
# It compiles binaries, produces installer output, and publishes artifacts to GitHub Releases.
#
# Operational goal:
# - Ensure published installers are built from immutable tags.
# - Keep distribution predictable for end users.
#
name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\inno\odtkra.iss"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Release/odtkra_agent.exe
            build/Release/odtkra_control_panel.exe
            packaging/output/ODTKRA-Setup.exe
